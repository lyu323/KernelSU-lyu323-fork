android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
# Modified for lyu323 fork (2026-11-24), revised 2026-11-24 v3:
# DEFAULT = official package name, because third-party tooling (DIRTYFRAGX etc.)
# scans for me.weishu.kernelsu by hardcoded name. The v2 "coexist" package
# (me.lyu323.kernelsu) was invisible to such tools - see COMPATIBILITY.md.
# A second "coexist" APK is built in the same CI run by overriding this with
#   -PKSU_PACKAGE_NAME=me.lyu323.kernelsu
# Kernel side must be rebuilt with KSU_MANAGER_PACKAGE matching the chosen
# package AND this APK's signing certificate hash, otherwise it is rejected.
KSU_PACKAGE_NAME=me.weishu.kernelsu
KSU_NAME=KernelSU (lyu323 Fork)

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
