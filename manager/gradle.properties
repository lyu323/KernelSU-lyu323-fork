android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
# Modified for lyu323 fork (2026-11-24): own applicationId so the fork and
# the official Manager can coexist. See FORK_NOTES.md / ROOT_GUIDE.md.
# NOTE: kernel side must be rebuilt with KSU_MANAGER_PACKAGE=me.lyu323.kernelsu
# AND this APK's signing certificate hash, otherwise the kernel rejects it.
KSU_PACKAGE_NAME=me.lyu323.kernelsu
KSU_NAME=KernelSU (lyu323 Fork)

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=4
android.native.buildOutput=verbose
