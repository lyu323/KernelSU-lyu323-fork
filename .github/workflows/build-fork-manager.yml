#
# Reproducible cloud build of the FORK'S OWN Manager APK (not a repack of the
# official binary). The corresponding source is exactly this commit; both
# LICENSE and kernel/LICENSE must accompany any distributed APK.
name: Build fork Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-fork-manager.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate preinstalled Android SDK / install pinned pieces
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          ls -d "$ANDROID_HOME"/platforms/* "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -8 || true
          ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null || true
          for p in "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"; do
            yes | sdkmanager --install "$p" >/dev/null 2>&1 || echo "sdkmanager skipped $p"
          done
          NDK=$(ls -d "$ANDROID_HOME"/ndk/29.0.14206865 2>/dev/null \
                || ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1)
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "chosen NDK: $NDK"
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/" 2>/dev/null | grep 'aarch64-linux-android26-clang' || true

      - name: Rust target
        run: |
          rustup target add aarch64-linux-android
          rustup update stable

      - name: Bundle official upstream LKM modules + ksuinit into ksud
        continue-on-error: true
        run: |
          mkdir -p userspace/ksud/bin/aarch64
          for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            curl -fL --retry 3 --max-time 180 \
              -o "userspace/ksud/bin/aarch64/${kmi}_kernelsu.ko" \
              "https://github.com/tiann/KernelSU/releases/download/v3.3.1/lkm-aarch64-${kmi}_kernelsu.ko" \
              || rm -f "userspace/ksud/bin/aarch64/${kmi}_kernelsu.ko"
          done
          curl -fL --retry 3 --max-time 180 -o userspace/ksud/bin/aarch64/ksuinit \
            "https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksuinit-aarch64" || true
          ls -lh userspace/ksud/bin/aarch64/

      - name: Build BOTH Manager variants (compat + coexist)
        continue-on-error: true
        run: |
          set -e
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          mkdir -p dist

          build_one() {
            PKG="$1"; NAME="$2"; OUT="$3"
            echo "=================================================="
            echo " variant: $PKG  ->  dist/$OUT"
            echo "=================================================="
            export KSU_PACKAGE_NAME="$PKG"
            cargo build --target aarch64-linux-android --release \
              --manifest-path ./userspace/ksud/Cargo.toml
            mkdir -p manager/app/src/main/jniLibs/arm64-v8a
            cp target/aarch64-linux-android/release/ksud \
               manager/app/src/main/jniLibs/arm64-v8a/libksud.so
            file manager/app/src/main/jniLibs/arm64-v8a/libksud.so
            ( cd manager && ./gradlew :app:clean :app:assembleDebug \
                -PKSU_PACKAGE_NAME="$PKG" \
                -PKSU_NAME="$NAME" \
                --stacktrace --no-daemon )
            APK=$(find manager/app/build/outputs/apk/debug -name '*.apk' -print -quit)
            test -n "$APK"
            cp "$APK" "dist/$OUT"
            echo "  built dist/$OUT ($(stat -c%s "dist/$OUT") bytes)"
          }

          # Compatible variant: official package name, visible to hardcoded scanners.
          build_one "me.weishu.kernelsu" \
            "KernelSU (lyu323 Fork)" \
            "KernelSU-lyu323-fork-compat.apk"
          # Coexist variant: independent package name, can be installed next to
          # the official Manager. See COMPATIBILITY.md for the trade-off.
          build_one "me.lyu323.kernelsu" \
            "KernelSU (lyu323 Fork Coexist)" \
            "KernelSU-lyu323-fork-coexist.apk"


      - name: Collect official upstream APK (reference / fallback)
        run: |
          curl -fL --retry 3 --max-time 600 -o upstream-official.apk \
            "https://github.com/tiann/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk" || true
          ls -lh upstream-official.apk 2>/dev/null || echo "official download skipped"

      - name: Collect APKs and licenses into dist/
        if: always()
        run: |
          set +e
          mkdir -p dist
          echo "--- gradle outputs (informational only; named variants already in dist/) ---"
          find manager/app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' || true
          if [ -s upstream-official.apk ]; then
            cp upstream-official.apk dist/upstream-official.apk
          fi
          cp LICENSE dist/LICENSE
          cp kernel/LICENSE dist/kernel-LICENSE
          echo "--- dist ---"
          ls -lh dist/
          echo "apk count: $(find dist -name '*.apk' | wc -l)"
          exit 0

      - name: Upload fork APK + licenses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-manager-apk
          path: dist/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-build-logs
          path: |
            manager/app/build/outputs/logs/*
            manager/build/reports/*
          if-no-files-found: ignore
